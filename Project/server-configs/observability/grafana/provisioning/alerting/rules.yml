apiVersion: 1

deleteRules:
  - { orgId: 1, uid: paj-backend-down }
  - { orgId: 1, uid: paj-not-ready }
  - { orgId: 1, uid: paj-sheet-stale }
  - { orgId: 1, uid: paj-court-stale }
  - { orgId: 1, uid: paj-sqlite-unhealthy }
  - { orgId: 1, uid: paj-pending-metadata }
  - { orgId: 1, uid: paj-http-failures }
  - { orgId: 1, uid: paj-stack-target-down }
  - { orgId: 1, uid: paj-host-disk-low }
  - { orgId: 1, uid: epiber-sheet-stale }
  - { orgId: 1, uid: epiber-sqlite-unhealthy }
  - { orgId: 1, uid: epiber-pending-metadata }

# Voraussetzung fuer Live: gepruefter Metrikbackport auf Basis von Live 5.0.0.
# Beide Deployments liefern echte PostgreSQL-Readiness und Projektionsmetriken.
groups:
  - orgId: 1
    name: epiber-applications
    folder: ePiber
    interval: 1m
    rules:
      - uid: epiber-backend-down
        title: ePiber Backend Down
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'up{job="epiber",deployment=~"live|devel"}'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: { datasource: { type: __expr__, uid: __expr__ }, expression: A, reducer: last, refId: B, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: '{{ $labels.deployment }} Backend ist nicht erreichbar'
          runbook: Project/server-configs/observability/RUNBOOKS.md#backend-down
        labels: { scope: application, severity: critical }

      - uid: epiber-not-ready
        title: ePiber Not Ready
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'epiber_ready{deployment=~"live|devel"}'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: { datasource: { type: __expr__, uid: __expr__ }, expression: A, reducer: last, refId: B, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: '{{ $labels.deployment }} ist laenger als zwei Minuten nicht bereit'
          runbook: Project/server-configs/observability/RUNBOOKS.md#not-ready
        labels: { scope: application, severity: critical }

      - uid: epiber-projection-missing
        title: ePiber PostgreSQL Projection Missing
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'min by (deployment) (epiber_projection_table_current{deployment=~"live|devel"})'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: { datasource: { type: __expr__, uid: __expr__ }, expression: A, reducer: last, refId: B, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: '{{ $labels.deployment }} besitzt keinen vollstaendigen PostgreSQL-Projektionssnapshot'
          runbook: Project/server-configs/observability/RUNBOOKS.md#not-ready
        labels: { scope: application, severity: warning }

      - uid: epiber-court-stale
        title: ePiber Court Source Stale
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'epiber_court_source_stale{deployment=~"live|devel"}'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: { datasource: { type: __expr__, uid: __expr__ }, expression: A, reducer: last, refId: B, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: 'Courtquelle von {{ $labels.deployment }} ist veraltet'
          runbook: Project/server-configs/observability/RUNBOOKS.md#court-source-stale
        labels: { scope: application, severity: warning }

      - uid: epiber-postgres-unhealthy
        title: ePiber PostgreSQL Runtime Unhealthy
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'min by (deployment) (epiber_readiness_component_ready{deployment=~"live|devel",component=~"postgres_runtime|postgres_score_state|postgres_audit|postgres_messaging"})'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: { datasource: { type: __expr__, uid: __expr__ }, expression: A, reducer: last, refId: B, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: 'Mindestens eine PostgreSQL-Laufzeitkomponente von {{ $labels.deployment }} ist ungesund'
          runbook: Project/server-configs/observability/RUNBOOKS.md#not-ready
        labels: { scope: application, severity: critical }

      - uid: epiber-projection-refresh-failed
        title: ePiber PostgreSQL Projection Refresh Failed
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'epiber_projection_refresh_failed{deployment=~"live|devel"}'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: { datasource: { type: __expr__, uid: __expr__ }, expression: A, reducer: last, refId: B, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: 'Letzter Projektionsreload von {{ $labels.deployment }} ist fehlgeschlagen; Last-good bleibt erhalten'
          runbook: Project/server-configs/observability/RUNBOOKS.md#not-ready
        labels: { scope: application, severity: warning }

      - uid: epiber-http-failures
        title: ePiber HTTP Server Errors
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'sum by (deployment) (rate(epiber_http_requests_total{deployment=~"live|devel",result="failed"}[5m]))'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: { datasource: { type: __expr__, uid: __expr__ }, expression: A, reducer: last, refId: B, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator: { params: [0.05], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: '{{ $labels.deployment }} erzeugt anhaltend HTTP-Serverfehler'
          runbook: Project/server-configs/observability/RUNBOOKS.md#http-server-errors
        labels: { scope: application, severity: warning }

  - orgId: 1
    name: epiber-host
    folder: ePiber
    interval: 1m
    rules:
      - uid: epiber-stack-target-down
        title: ePiber Observability Target Down
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'min(up{job=~"prometheus|node|loki|alloy|grafana|grafana-auth"})'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: { datasource: { type: __expr__, uid: __expr__ }, expression: A, reducer: last, refId: B, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: Mindestens ein Observability-Ziel ist nicht erreichbar
          runbook: Project/server-configs/observability/RUNBOOKS.md#observability-target-down
        labels: { scope: host, severity: critical }

      - uid: epiber-host-disk-low
        title: ePiber Host Disk Nearly Full
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'min(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs"})'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: { datasource: { type: __expr__, uid: __expr__ }, expression: A, reducer: last, refId: B, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator: { params: [0.1], type: lt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 15m
        annotations:
          summary: Host-Dateisystem hat weniger als zehn Prozent frei
          runbook: Project/server-configs/observability/RUNBOOKS.md#host-disk-nearly-full
        labels: { scope: host, severity: warning }
