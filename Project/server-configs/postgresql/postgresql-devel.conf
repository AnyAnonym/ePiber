cluster_name = 'shared-devel'
data_directory = '/var/lib/development-data/postgresql/18/data'
hba_file = '/etc/postgresql-devel/pg_hba.conf'
ident_file = '/etc/postgresql-devel/pg_ident.conf'
listen_addresses = '127.0.0.1'
port = 5433
unix_socket_directories = '/run/postgresql/devel'
unix_socket_group = 'postgres-devel-client'
unix_socket_permissions = 0770
max_connections = 30
shared_buffers = '128MB'
work_mem = '4MB'
maintenance_work_mem = '64MB'
effective_cache_size = '1GB'
wal_compression = on
min_wal_size = '80MB'
max_wal_size = '1GB'
fsync = on
synchronous_commit = on
full_page_writes = on
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = auto
track_io_timing = on
password_encryption = 'scram-sha-256'
timezone = 'UTC'
log_timezone = 'UTC'
ssl = off
logging_collector = off
log_destination = 'stderr'
log_statement = 'none'
log_min_duration_statement = 1000
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_lock_waits = on
deadlock_timeout = '1s'
log_checkpoints = on
log_connections = off
log_disconnections = off
temp_file_limit = '1GB'
