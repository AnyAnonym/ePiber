APP_NAME = ePiber Development Git
RUN_USER = gitea
RUN_MODE = prod
WORK_PATH = /var/lib/development-data/gitea

[server]
PROTOCOL = http
DOMAIN = 127.0.0.1
ROOT_URL = http://127.0.0.1:13002/
LOCAL_ROOT_URL = http://127.0.0.1:3002/
PUBLIC_URL_DETECTION = never
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 3002
OFFLINE_MODE = true
DISABLE_SSH = true
START_SSH_SERVER = false
SSH_CREATE_AUTHORIZED_KEYS_FILE = false
SSH_CREATE_AUTHORIZED_PRINCIPALS_FILE = false
APP_DATA_PATH = /var/lib/development-data/gitea/data
APP_TEMP_PATH = /var/lib/development-data/gitea/tmp
ENABLE_GZIP = true
ENABLE_PPROF = false
LFS_START_SERVER = true
LFS_JWT_SECRET_URI = file:/run/credentials/gitea-devel.service/lfs_jwt_secret
LFS_MAX_FILE_SIZE = 536870912

[database]
DB_TYPE = postgres
HOST = 127.0.0.1:5433
NAME = gitea
USER = gitea_app
SCHEMA = public
SSL_MODE = disable
LOG_SQL = false
MAX_IDLE_CONNS = 2
MAX_OPEN_CONNS = 5
CONN_MAX_LIFETIME = 5m
AUTO_MIGRATION = true
SLOW_QUERY_THRESHOLD = 5s

[security]
INSTALL_LOCK = true
SECRET_KEY_URI = file:/run/credentials/gitea-devel.service/secret_key
INTERNAL_TOKEN_URI = file:/run/credentials/gitea-devel.service/internal_token
MIN_PASSWORD_LENGTH = 12
PASSWORD_COMPLEXITY = lower,upper,digit,spec
IMPORT_LOCAL_PATHS = false
DISABLE_GIT_HOOKS = true
DISABLE_WEBHOOKS = true
DISABLE_QUERY_AUTH_TOKEN = true
PASSWORD_CHECK_PWN = false

[service]
DISABLE_REGISTRATION = true
SHOW_REGISTRATION_BUTTON = false
REQUIRE_SIGNIN_VIEW = true
ENABLE_NOTIFY_MAIL = false
DEFAULT_KEEP_EMAIL_PRIVATE = true
DEFAULT_ALLOW_CREATE_ORGANIZATION = true
DEFAULT_USER_VISIBILITY = private
ALLOWED_USER_VISIBILITY_MODES = private
DEFAULT_ORG_VISIBILITY = private
DEFAULT_ORG_MEMBER_VISIBLE = false
NO_REPLY_ADDRESS = localhost.invalid

[repository]
ROOT = /var/lib/development-data/gitea/repositories
FORCE_PRIVATE = true
DEFAULT_PRIVATE = private
DEFAULT_PUSH_CREATE_PRIVATE = true
MAX_CREATION_LIMIT = 100
DISABLE_MIGRATIONS = true
DISABLED_REPO_UNITS = repo.packages,repo.actions
DEFAULT_REPO_UNITS = repo.code,repo.releases,repo.issues,repo.pulls,repo.wiki,repo.projects
DEFAULT_FORK_REPO_UNITS = repo.code,repo.pulls
DEFAULT_BRANCH = main
ENABLE_PUSH_CREATE_USER = false
ENABLE_PUSH_CREATE_ORG = false

[repository.upload]
ENABLED = true
FILE_MAX_SIZE = 20
MAX_FILES = 5

[repository.release]
FILE_MAX_SIZE = 250
MAX_FILES = 5

[attachment]
ENABLED = true
MAX_SIZE = 20
MAX_FILES = 5
STORAGE_TYPE = local
PATH = attachments

[packages]
ENABLED = false

[actions]
ENABLED = false

[mirror]
ENABLED = false

[mailer]
ENABLED = false

[openid]
ENABLE_OPENID_SIGNIN = false
ENABLE_OPENID_SIGNUP = false

[oauth2]
JWT_SECRET_URI = file:/run/credentials/gitea-devel.service/oauth2_jwt_secret
ENABLED = false

[federation]
ENABLED = false

[metrics]
ENABLED = false

[api]
ENABLE_SWAGGER = false

[session]
PROVIDER = db
COOKIE_NAME = epiber_devel_gitea
COOKIE_SECURE = false
SAME_SITE = strict
SESSION_LIFE_TIME = 86400

[cache]
ADAPTER = memory

[indexer]
ISSUE_INDEXER_TYPE = db
REPO_INDEXER_ENABLED = false

[cron]
ENABLED = true
RUN_AT_START = false

[cron.update_checker]
ENABLED = false
RUN_AT_START = false

[qos]
ENABLED = true
MAX_INFLIGHT = 8
MAX_WAITING = 50
TARGET_WAIT_TIME = 250ms

[storage]
STORAGE_TYPE = local

[lfs]
STORAGE_TYPE = local
PATH = /var/lib/development-data/gitea/data/lfs

[admin]
DISABLE_REGULAR_ORG_CREATION = false
DEFAULT_EMAIL_NOTIFICATIONS = disabled

[ui]
SHOW_USER_EMAIL = false

[other]
SHOW_FOOTER_VERSION = false
SHOW_FOOTER_TEMPLATE_LOAD_TIME = false
ENABLE_SITEMAP = false
ENABLE_FEED = false

[log]
MODE = console
LEVEL = Info
STACKTRACE_LEVEL = Error
