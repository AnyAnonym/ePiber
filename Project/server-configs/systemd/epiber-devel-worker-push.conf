# Optionaler PAJ-Push-Pilot; NICHT automatisch installieren.
# Ziel: /etc/systemd/system/epiber-devel-worker.service.d/push-pilot.conf
# Gleiche push.env und VAPID-Identitaet wie die PAJ-App verwenden.
# Die ausdrueckliche Installation erweitert nur fuer diesen Worker die bisherige
# Unix-Socket-Grenze um DNS/HTTPS zu Browser-Push-Diensten. Die App behaelt ihre
# Loopback-Grenze; der Worker bietet selbst keinen HTTP-Listener an.
[Service]
EnvironmentFile=/etc/epiber-devel/push.env
LoadCredential=push-vapid-private:/etc/epiber-devel/credentials/push-vapid-private
Environment=PUSH_VAPID_PRIVATE_KEY_FILE=%d/push-vapid-private
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
