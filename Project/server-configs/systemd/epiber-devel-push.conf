# Optionaler PAJ-Push-Pilot; NICHT automatisch installieren.
# Ziel: /etc/systemd/system/epiber-devel.service.d/push-pilot.conf
# Zuerst Schema 9 und Grants, push.env sowie einen neuen geschuetzten
# VAPID-Schluessel nur fuer diese Origin bereitstellen. Danach separat freigegeben
# daemon-reload und App-/Worker-Neustart. Keine Aenderung am Live-System.
[Service]
EnvironmentFile=/etc/epiber-devel/push.env
LoadCredential=push-vapid-private:/etc/epiber-devel/credentials/push-vapid-private
Environment=PUSH_VAPID_PRIVATE_KEY_FILE=%d/push-vapid-private
