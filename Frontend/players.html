<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#176b4a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ePiber" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/Images/pwa/apple-touch-icon.png" />
  <title>ASKÖ Piberbach – Spieler</title>
  <link rel="stylesheet" href="./CSS/styles.css" />
</head>

<body aria-busy="true">

  <div class="loading-overlay" data-initial-loading-overlay role="status" aria-live="polite" aria-atomic="true">
    <div class="loading-overlay-content">
      <div class="loading-spinner" aria-hidden="true"></div>
      <div class="loading-text">Lade Daten ...</div>
    </div>
  </div>

  <div id="header-container"></div>
  <div id="mobile-nav-container"></div>

  <main>
    <section id="playerDirectorySection" class="full-width-section">
      <h2>Spieler</h2>
      <div id="playerDirectoryMessage" aria-live="polite"></div>
      <div class="players-table-scroll">
        <table id="tbl" class="players-table" hidden>
          <thead>
            <tr>
              <th>Nachname</th>
              <th>Vorname</th>
              <th>Telefon</th>
              <th>E-Mail</th>
              <th>Geburtsdatum</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <div id="sidebar-container"></div>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="JS/modals.js"></script>
  <script type="module" src="JS/navbar.js"></script>
  <script type="module" src="JS/playerList.js"></script>
  <script src="JS/global.js"></script>
  <script src="JS/clock.js"></script>
  <script src="JS/footer.js"></script>

</body>

</html>
