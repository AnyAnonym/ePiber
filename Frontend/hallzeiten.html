<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASKÖ Piberbach – Hallenzeiten</title>
  <link rel="stylesheet" href="./CSS/styles.css" />
  <link rel="stylesheet" href="./CSS/hallzeiten.css" />
</head>
<body>
  <div id="header-container"></div>
  <div id="mobile-nav-container"></div>
  <main class="hall-time-main">
    <section id="hall-time-access" class="hall-time-card" aria-live="polite">
      <h1>Hallenzeiten</h1>
      <p id="hall-time-access-message">Raster wird geladen …</p>
      <a href="index.html?dashboard=1">Zur Startseite</a>
    </section>
    <div id="hall-time-app" hidden>
      <header class="hall-time-heading">
        <button id="hall-time-info-open" class="hall-time-info-button" type="button" aria-label="Informationen zum Raster" aria-haspopup="dialog">i</button>
        <div class="favorite-title-row favorite-title-row-centered"><h1 id="hall-time-title">Hallenzeiten</h1></div>
      </header>
      <nav class="hall-time-view-controls" aria-label="Rasteransicht"><button id="hall-time-view-all" type="button" aria-pressed="true">Alle</button><button id="hall-time-view-current" type="button" aria-pressed="false">Aktuell</button></nav>
      <dialog id="hall-time-info-dialog" class="hall-time-info-dialog" aria-label="Rasterbeschreibung">
        <form method="dialog">
          <button class="hall-time-info-close" type="submit" aria-label="Informationen schließen">×</button>
          <p id="hall-time-description" class="hall-time-description"></p>
        </form>
      </dialog>
      <dialog id="hall-time-message-dialog" class="hall-time-info-dialog hall-time-message-dialog" aria-label="Meldung">
        <form method="dialog">
          <button class="hall-time-info-close" type="submit" aria-label="Meldung schließen">×</button>
          <p id="hall-time-message-text" class="hall-time-message-text" role="alert"></p>
        </form>
      </dialog>
      <p id="hall-time-feedback" class="hall-time-feedback" role="status" aria-live="polite"></p>
      <section class="hall-time-table-card" aria-label="Hallenzeiten-Raster">
        <div class="hall-time-table-scroll">
          <table id="hall-time-table">
            <thead><tr id="hall-time-head"></tr></thead>
            <tbody id="hall-time-body"></tbody>
            <tfoot><tr id="hall-time-foot"></tr></tfoot>
          </table>
        </div>
        <div class="hall-time-legend" aria-label="Legende"><span class="is-confirmed">✓ Dabei</span><span class="is-waitlist">⌛ Warteliste</span><span class="is-empty">× nicht Dabei</span><span class="hall-time-constraint-legend"><i class="constraint-unavailable" aria-hidden="true"></i>Verhindert</span><span class="hall-time-constraint-legend"><i class="constraint-avoid" aria-hidden="true"></i>Möglichst vermeiden</span></div>
      </section>
      <section class="hall-time-card hall-time-history" aria-labelledby="hall-time-history-title">
        <h2 id="hall-time-history-title">Historie</h2>
        <ol id="hall-time-history-list" class="competition-history-list"></ol>
      </section>
    </div>
  </main>
  <div id="footer-container"></div>
  <script type="module" src="JS/navbar.js"></script>
  <script type="module" src="JS/modals.js"></script>
  <script type="module" src="JS/favorites.js"></script>
  <script type="module" src="JS/hallzeiten.js"></script>
  <script src="JS/global.js"></script>
  <script src="JS/clock.js"></script>
  <script src="JS/footer.js"></script>
</body>
</html>
